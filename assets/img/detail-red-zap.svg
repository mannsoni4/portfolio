<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Red Zap profile view illustration">
  <rect width="800" height="500" fill="#101013"/>

  <!-- header -->
  <rect x="0" y="0" width="800" height="60" fill="#141419"/>
  <line x1="0" y1="60" x2="800" y2="60" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <rect x="28" y="18" width="26" height="26" rx="8" fill="#F0564A" fill-opacity="0.92"/>
  <rect x="68" y="27" width="90" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.16"/>
  <rect x="560" y="24" width="120" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.05"/>
  <circle cx="716" cy="31" r="9" fill="#FFFFFF" fill-opacity="0.1"/>
  <circle cx="756" cy="31" r="12" fill="#FFFFFF" fill-opacity="0.12"/>

  <!-- cover banner -->
  <rect x="120" y="88" width="560" height="104" rx="12" fill="#FFFFFF" fill-opacity="0.045"/>
  <circle cx="620" cy="120" r="34" fill="#F0564A" fill-opacity="0.08"/>

  <!-- avatar overlapping -->
  <circle cx="400" cy="192" r="44" fill="#FFFFFF" fill-opacity="0.14" stroke="#101013" stroke-width="5"/>
  <circle cx="386" cy="186" r="5" fill="#101013" fill-opacity="0.5"/>
  <circle cx="414" cy="186" r="5" fill="#101013" fill-opacity="0.5"/>

  <!-- name + handle -->
  <rect x="310" y="252" width="180" height="13" rx="6.5" fill="#FFFFFF" fill-opacity="0.2"/>
  <rect x="340" y="274" width="120" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.08"/>

  <!-- stats -->
  <g>
    <rect x="250" y="300" width="80" height="40" rx="10" fill="#141419"/>
    <rect x="278" y="308" width="24" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.18"/>
    <rect x="272" y="324" width="36" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.08"/>
  </g>
  <g>
    <rect x="360" y="300" width="80" height="40" rx="10" fill="#141419"/>
    <rect x="388" y="308" width="24" height="10" rx="5" fill="#F0564A" fill-opacity="0.8"/>
    <rect x="382" y="324" width="36" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.08"/>
  </g>
  <g>
    <rect x="470" y="300" width="80" height="40" rx="10" fill="#141419"/>
    <rect x="498" y="308" width="24" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.18"/>
    <rect x="492" y="324" width="36" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.08"/>
  </g>

  <!-- tabs -->
  <rect x="270" y="368" width="260" height="1" fill="#FFFFFF" fill-opacity="0.08"/>
  <rect x="352" y="366" width="96" height="3" rx="1.5" fill="#F0564A"/>
  <rect x="276" y="352" width="48" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.07"/>
  <rect x="352" y="350" width="96" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.2"/>
  <rect x="476" y="352" width="48" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.07"/>

  <!-- media grid -->
  <rect x="140" y="396" width="248" height="80" rx="10" fill="#FFFFFF" fill-opacity="0.045"/>
  <circle cx="264" cy="436" r="20" fill="#FFFFFF" fill-opacity="0.05"/>
  <rect x="412" y="396" width="248" height="80" rx="10" fill="#FFFFFF" fill-opacity="0.045"/>
  <circle cx="536" cy="436" r="20" fill="#F0564A" fill-opacity="0.09"/>
</svg>
